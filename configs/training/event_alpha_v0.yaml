# Event Alpha Model v0 - training config (no secrets here)
experiment_name: "Event Alpha Model v0"

paths:
  news_parquet: data/event_alpha/raw/financial_news.parquet
  prices_dir: data/event_alpha/raw/prices
  processed_dir: data/event_alpha/processed
  pretrained_dir: artifacts/pretrained/event_alpha_encoder   # local path only (no HF id in code)
  artifacts_dir: artifacts/event_alpha
  log_dir: logs/training

data:
  max_tickers: 250
  benchmark: SPY
  market_symbols: [SPY, QQQ, _VIX]
  include_ticker_in_text: false      # avoid ticker-memorization shortcut
  include_publisher_in_text: true

split:                               # chronological only; random split is not supported
  train_end: "2017-12-31"
  val_end: "2018-12-31"              # test = 2019-01-01 .. end of data
  embargo_days: 7

label:
  horizons: [1, 3, 5]
  cls_horizon: 3
  lower_quantile: 0.30               # thresholds fitted on train only
  upper_quantile: 0.70

model:
  max_length: 64
  market_hidden: 64
  dropout: 0.1
  reg_loss_weight: 1.0

train:
  seed: 42
  epochs: 5
  batch_size: 128
  eval_batch_size: 512
  lr: 2.0e-5
  head_lr: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.06
  grad_clip: 1.0
  precision: auto                    # bf16 if supported
  early_stopping_patience: 1
  checkpoint_every_steps: 2000
  log_every_steps: 100
  max_oom_retries: 2

eval:
  top_fracs: [0.01, 0.05, 0.10, 0.20]
  cost_bps_scenarios: [0, 5, 10, 20]
  signal_horizon: 3

monitor:
  heartbeat_seconds: 30
  supabase_every_seconds: 60
  supabase_enabled: auto             # only when SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are set
