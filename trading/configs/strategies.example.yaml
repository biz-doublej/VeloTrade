# =============================================================================
# VeloTrade trading — 전략 설정 예시
# =============================================================================
# 사용: cp configs/strategies.example.yaml configs/strategies.yaml
#       python -m velotrade_trading run --config configs/strategies.yaml
#
# 파라미터 근거: Day 5 백테스트 grid search (24 symbols × 9 params = 216 건, 2년)
#   - 파라미터 분포 (best by sharpe):
#       period:    21 (57%)  > 14 (24%) > 9 (19%)
#       oversold:  30 (62%)  > 25 (38%)
#       overbought:75 (76%)  > 70 (24%)
#   - 종목군 평균 Sharpe:
#       Index ETF       1.62  (SPY/QQQ/IWM/DIA)
#       Sector ETF      1.23  (XLF/XLE/XLK/XLV)
#       Mag 7           1.20
#       Other Stock     1.18
#       Crypto (Binance) — 데이터 부족 (testnet limit)
#
# Top 5 by Sharpe (개별 종목):
#   QQQ    RSI(21, 30/75) Sharpe 1.86 return +10.44% DD 2.57%
#   GOOGL  RSI(14, 25/75) Sharpe 1.79
#   SPY    RSI(21, 30/75) Sharpe 1.75
#   XLE    RSI( 9, 25/75) Sharpe 1.73
#   XLK    RSI(21, 30/70) Sharpe 1.65
#
# ⚠️ 권장: 변동성 큰 NVDA/META 는 따로 period=9 또는 watchlist 제외 검토

exchange: alpaca
mode: paper

# Sharpe 1.5+ 인 핵심 종목만
symbols:
  - SPY
  - QQQ
  - AAPL
  - GOOGL
  - XLK
  - XLE

strategies:
  # 메인: 24 종목 grid 평균 sweet spot
  - name: rsi
    period: 21
    oversold: 30
    overbought: 75
    size_pct: 0.05

  # 변동성 큰 종목용 (별도 인스턴스 — 추후 종목별 분리 시)
  # - name: rsi
  #   period: 9
  #   oversold: 25
  #   overbought: 75
  #   size_pct: 0.03

